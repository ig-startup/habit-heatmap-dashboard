# CI/CD habit-heatmap (fin.garaev.tech).
# PR и пуш: тесты backend и local-agent, сборка docker-образов.
# Пуш в main: образы → ghcr.io (теги: коммит и latest), затем деплой на sites-prod (80.71.152.161).
# Сервер ничего не собирает (у него <1 ГБ памяти, см. инцидент 07.10 в scripts/deploy.sh) — только скачивает образы.
# Деплой: ключ CI на сервере привязан к одной команде — habit-deploy <коммит>
# (скачать образы, перезапустить, проверить /api/metrics, при сбое откатиться).
# Секреты репо: DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS, DEPLOY_HOST, DEPLOY_USER.

name: deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/ig-startup

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        dir: [backend, local-agent]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.dir }}/requirements.txt
      - name: Тесты ${{ matrix.dir }}
        working-directory: ${{ matrix.dir }}
        run: |
          pip install -r requirements.txt
          pytest -q

  images:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Образ ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/habit-heatmap-dashboard-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/habit-heatmap-dashboard-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: images
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: SSH-ключ
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Деплой
        # На сервере ключ может выполнить только habit-deploy; передаём ему коммит.
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "${GITHUB_SHA}"

      - name: Проверка снаружи
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://fin.garaev.tech/api/metrics)
            [ "$code" = 200 ] && { echo "OK: /api/metrics → 200"; exit 0; }
            echo "попытка $i: $code, ждём…"; sleep 5
          done
          echo "::error::fin.garaev.tech/api/metrics не отвечает 200"; exit 1
